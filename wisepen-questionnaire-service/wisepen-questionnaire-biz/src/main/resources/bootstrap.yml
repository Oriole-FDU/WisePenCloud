server:
  port: 19909

spring:
  application:
    name: wisepen-questionnaire-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yaml
        group: DEFAULT_GROUP
        shared-configs:
          - data-id: wisepen-common-${spring.profiles.active}.yaml
            group: DEFAULT_GROUP
            refresh: true
    inetutils:
      ignored-interfaces:
        - VMnet.*
        - vEthernet.*
        - docker0
      preferred-networks:
        - 10
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

wisepen:
  openapi:
    title: 表格问卷服务 API
    version: 1.0.0
    description: WisePen 表格定义、问卷视图与填写数据接口

springwolf:
  plugin:
    kafka:
      scanner:
        kafka-listener:
          enabled: false
  docket:
    base-package: com.oriole.wisepen.questionnaire
    info:
      title: 问卷服务 Kafka Events
      version: 1.0.0
      description: 问卷资源物理删除相关 Kafka 消息契约
