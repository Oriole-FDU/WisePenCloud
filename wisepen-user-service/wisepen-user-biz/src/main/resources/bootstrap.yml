server:
  port: 19903 # 本地启动占用 19903 端口

spring:
  application:
    name: wisepen-user-service # 服务名，也是 Nacos 里的 Data ID
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848} # Nacos 注册中心地址；外部默认 localhost
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848} # Nacos 配置中心地址；外部默认 localhost
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml # 配置文件后缀
        group: DEFAULT_GROUP
        shared-configs:
          - data-id: wisepen-common-${spring.profiles.active}.yaml
            group: DEFAULT_GROUP
            refresh: true
    inetutils:
      ignored-interfaces:
        - VMnet.*
        - vEthernet.*
        - docker0 # 忽略常见的虚拟机网卡名称 (正则匹配)
      preferred-networks:
        - 10 #指定首选的网络号段 (校园网段10开头)
  profiles:
    active: dev # 激活开发环境配置

wisepen:
  user:
    api-domain: ${WISEPEN_USER_API_DOMAIN:}
    auth-cookie-domain: ${WISEPEN_USER_AUTH_COOKIE_DOMAIN:}
  user-task:
    rules:
      STUDENT_VERIFICATION:
        enabled: ${WISEPEN_USER_TASK_STUDENT_VERIFICATION_ENABLED:true}
        reward-type: ${WISEPEN_USER_TASK_STUDENT_VERIFICATION_REWARD_TYPE:TOKEN}
        reward-amount: ${WISEPEN_USER_TASK_STUDENT_VERIFICATION_REWARD_AMOUNT:5000000}
      TEACHER_VERIFICATION:
        enabled: ${WISEPEN_USER_TASK_TEACHER_VERIFICATION_ENABLED:true}
        reward-type: ${WISEPEN_USER_TASK_TEACHER_VERIFICATION_REWARD_TYPE:TOKEN}
        reward-amount: ${WISEPEN_USER_TASK_TEACHER_VERIFICATION_REWARD_AMOUNT:100000000}
    daily-check-in:
      enabled: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_ENABLED:true}
      reward-type: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_REWARD_TYPE:TOKEN}
      min-reward-amount: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_MIN_REWARD_AMOUNT:100000}
      max-reward-amount: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_MAX_REWARD_AMOUNT:1000000}
      reward-step-amount: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_REWARD_STEP_AMOUNT:100000}
      refresh-cycle-days: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_REFRESH_CYCLE_DAYS:1}
      guarantee-cycle-count: ${WISEPEN_USER_TASK_DAILY_CHECK_IN_GUARANTEE_CYCLE_COUNT:10}
  openapi:
    title: 用户服务 API
    version: 1.0.0
    description: WisePen 用户、认证、小组与钱包接口

springwolf:
  plugin:
    kafka:
      scanner:
        kafka-listener:
          enabled: false
  docket:
    base-package: com.oriole.wisepen.user
    info:
      title: 用户服务 Kafka Events
      version: 1.0.0
      description: Token 计费与复旦 UIS 认证请求相关 Kafka 消息契约
